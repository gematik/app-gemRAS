fd-auth-server:
  esSigPrivKeyConfig:
    fileName: keys/ref-privkey.pem
    keyId: puk_fd_sig
    use: sig
    addX5c: false
  esSigPubKeyConfig:
    fileName: keys/ref-pubkey.pem
    keyId: puk_fd_sig
    use: sig
  tlsClientPrivKeyConfig:
    fileName: classpath:cert/ref-key.p12
    keyId: puk_tls_sig
    use: sig
    x5cInJwks: true
  tlsClientPrivKeyRotationConfig:
    fileName: classpath:cert/ref-key-rotation.p12
    keyId: puk_tls_sig_rotation
    use: sig
    x5cInJwks: true
  encPrivKeyConfig:
    fileName: keys/ref-privkey.pem
    keyId: puk_fd_enc
    use: enc
    x5cInJwks: false
  encPubKeyConfig:
    fileName: keys/ref-pubkey.pem
    keyId: puk_fd_enc
    use: enc
  tokenSigPrivKeyConfig:
    fileName: keys/ref-privkey.pem
    keyId: puk_token_sig
    use: sig
    x5cInJwks: false
  tokenSigPubKeyConfig:
    fileName: keys/ref-pubkey.pem
    keyId: puk_token_sig
    use: sig
  accessTokenSigPrivKeyConfig:
    fileName: keys/ref-privkey.pem
    keyId: puk_access_token_sig
    use: sig
    x5cInJwks: false
  accessTokenSigPubKeyConfig:
    fileName: keys/ref-pubkey.pem
    keyId: puk_access_token_sig
    use: sig

  symmetricEncryptionKey: "setYourKeyHere"
  serverUrl: "${FD_AUTH_SERVER_URL:http://127.0.0.1:8084}"
  fedmasterUrl: "${FEDMASTER_SERVER_URL:http://127.0.0.1:8083}"
  fedmasterSigPubKeyFilePath: "keys/ref-fedmaster-sig-pubkey.pem"
server:
  port: ${SERVER_PORT:8084}
management:
  server:
    port: ${MANAGEMENT_PORT:8184}
  endpoints:
    web:
      exposure:
        include: "health"
    access:
      default: read_only
  endpoint:
    health:
      access: read_only
    metrics:
      access: read_only
    logfile:
      access: read_only
logging:
  level:
    de.gematik: ${LOG_LEVEL_GEMATIK:info}
  CommonsRequestLoggingEnabled: ${REQUEST_LOGGING_ENABLED:false}
